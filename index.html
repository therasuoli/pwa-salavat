<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#104d32">
<meta name="color-scheme" content="light dark">
<!-- منبع واحد شماره نسخه: فقط همین مقدار را تغییر دهید -->
<meta name="app-version" content="1.5.0">
<title>صلوات شمار</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- فونت‌ها بدون مسدود کردن نمایش صفحه بارگذاری می‌شوند -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap"></noscript>

<style>
@layer reset,base,components,responsive;

/* =============== RESET =============== */
@layer reset{
  *,*::before,*::after{box-sizing:border-box}
  *{-webkit-tap-highlight-color:transparent}
  :where(h1,h2,h3,p){margin:0}
  .hidden{display:none!important}
}

/* =============== BASE =============== */
@layer base{
  :root{
    color-scheme:light;
    --green:#104d32;--green2:#1b7048;--gold:#c5a267;
    --bg:#f4f8f5;--card:#fff;--text:#1d2b23;--muted:#78877e;
    --border:#e3ebe5;--soft:#eaf4ed;--red:#c34d4d;
    --shadow:0 8px 28px rgb(15 65 40/.08);
  }
  body.dark{
    color-scheme:dark;
    --bg:#101914;--card:#1a251e;--text:#edf4ef;--muted:#a2b0a7;
    --border:#2c3a31;--soft:#243a2c;--shadow:0 8px 28px rgb(0 0 0/.2);
  }
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-block-size:100dvh;background:var(--bg);color:var(--text);
    font-family:Vazirmatn,"Segoe UI",system-ui,Tahoma,sans-serif;line-height:1.7;
    padding-block-end:calc(92px + env(safe-area-inset-bottom,0px));
    transition:background .2s,color .2s;
  }
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  a{color:var(--green2)}
  body.dark a{color:#e5c985}
  .small,.muted{font-size:.6875rem;color:var(--muted)}

  button,input,select{font:inherit;color:inherit}
  button{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-block-size:40px;padding:0 14px;border:1px solid var(--border);border-radius:12px;
    background:var(--bg);color:var(--text);font-size:.6875rem;font-weight:600;
    cursor:pointer;touch-action:manipulation;transition:transform .12s,filter .2s,background .2s;
  }
  button:hover{filter:brightness(.98)}
  button:active{transform:scale(.97)}
  button:disabled{opacity:.55;cursor:not-allowed}
  button.green{background:var(--green);color:#fff;border-color:var(--green)}
  button.gold{background:#f8f0df;color:#765a28;border-color:#ead8ad}
  body.dark button.gold{background:#3a3220;color:#f0dfb7;border-color:#5a4a28}
  button.red,button.danger{color:var(--red)}
  button.primary{
    inline-size:100%;block-size:46px;border:0;border-radius:13px;
    background:linear-gradient(135deg,#1b7048,#104d32);color:#fff;font-size:.8125rem;font-weight:700;
  }
  button.full{inline-size:100%;margin-block-start:8px}

  select,
  input:where([type=text],[type=number],[type=email],[type=password]){
    display:block;inline-size:100%;block-size:45px;margin-block:4px;padding:0 12px;
    border:1px solid var(--border);border-radius:13px;background:var(--bg);color:var(--text);
    font-size:.75rem;outline:none;
  }
  select:focus,input:focus{border-color:var(--gold)}
  input[type=file]{inline-size:100%;padding:10px;border:1px dashed var(--border);border-radius:13px;font-size:.6875rem;background:var(--bg)}
  label.field-label{display:block;font-size:.6875rem;color:var(--muted);margin-block:8px 6px}
}

/* =============== COMPONENTS =============== */
@layer components{
  .app{max-inline-size:900px;margin-inline:auto}

  /* --- هدر --- */
  header{
    background:linear-gradient(135deg,#0b3d27,#1b7048);color:#fff;
    padding:calc(20px + env(safe-area-inset-top,0px)) 17px 22px;
    border-radius:0 0 28px 28px;box-shadow:0 8px 25px #104d3225;
  }
  body.dark header{background:linear-gradient(135deg,#0a2a1c,#14543a)}
  .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;gap:11px}
  .brand-icon{inline-size:46px;block-size:46px;border-radius:15px;display:grid;place-items:center;background:#ffffff19;font-size:1.6rem;border:1px solid #ffffff30}
  .brand h1{font-size:1.25rem;font-weight:800}
  .brand p{font-size:.6875rem;margin-block-start:2px;opacity:.75}
  .head-actions{display:flex;gap:7px}
  .head-btn{inline-size:40px;block-size:40px;min-block-size:0;padding:0;border-radius:13px;border:1px solid #ffffff35;background:#ffffff16;color:#fff;font-size:1.1rem}
  .head-btn.on{background:linear-gradient(135deg,#f2dc9f,#c5a267);color:#1a2a22;border-color:transparent}
  .header-sub{margin-block-start:18px;font-family:Amiri,"Noto Naskh Arabic",serif;font-size:1.19rem;text-align:center;color:#f0dfb7}
  .net-line{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-block-start:12px;font-size:.625rem;color:#ffffffb8}
  .network-dot{inline-size:8px;block-size:8px;border-radius:50%;background:#e06b6b;box-shadow:0 0 8px currentColor;color:#e06b6b}
  .network-dot.online{background:#62d69b;color:#62d69b}
  .cloud-status{border-inline-start:1px solid #ffffff40;padding-inline-start:9px}

  main{padding:15px}
  .tab{animation:appear .2s ease}
  @keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .tab-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));align-items:start}
  .tab-grid>.card{margin:0}

  /* --- کارت --- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:21px;padding:16px;margin-block-end:14px;box-shadow:var(--shadow)}
  .card-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block-end:14px}
  .card-title h2{font-size:.9375rem}
  .card-title small{font-size:.625rem;color:var(--muted)}
  .divider{block-size:1px;background:var(--border);margin-block:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>*{flex:1;min-inline-size:110px}
  .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
  .status{background:var(--soft);color:var(--green);border-radius:12px;padding:9px 11px;font-size:.625rem;margin-block-start:12px;text-align:center;line-height:1.9}
  body.dark .status{color:#d6ebdc}
  .status:empty{display:none}
  .voice-status.warn{color:#9a6a12;background:#f8f0df}
  body.dark .voice-status.warn{color:#f3dda1;background:#3a3220}

  /* --- اوقات شرعی --- */
  .prayer-card{background:linear-gradient(135deg,#fff,#eff8f1);border:1px solid var(--border);border-radius:20px;padding:15px;margin-block-end:14px;box-shadow:var(--shadow)}
  body.dark .prayer-card{background:#1a2920}
  .prayer-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .clock{font-size:1.8rem;font-weight:800;color:var(--green);direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
  body.dark .clock{color:#e5c985}
  .prayer-date{font-size:.625rem;color:var(--muted)}
  .next-prayer{text-align:start;font-size:.625rem;color:var(--muted)}
  .next-prayer strong{display:block;color:var(--green);font-size:.8125rem}
  body.dark .next-prayer strong{color:#e5c985}
  .prayer-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-block-start:13px}
  .prayer-item{background:#104d320b;border-radius:12px;padding:9px 2px;text-align:center}
  body.dark .prayer-item{background:#ffffff0b}
  .prayer-item small{display:block;color:var(--muted);font-size:.5625rem}
  .prayer-item b{display:block;font-size:.75rem;color:var(--green);margin-block-start:3px}
  body.dark .prayer-item b{color:#e5c985}

  /* --- شمارنده --- */
  .arabic{font-family:Amiri,"Scheherazade New","Noto Naskh Arabic",serif;font-size:clamp(1.6rem,1.3rem + 1vw,1.9rem);line-height:1.9;text-align:center;color:var(--green);padding-block:12px 2px}
  body.dark .arabic{color:#e8cf96}
  .translation{text-align:center;color:var(--muted);font-size:.6875rem;min-block-size:20px}
  .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-block:6px 13px}
  .mode-option{position:relative;display:block}
  .mode-option input{position:absolute;inset:0;inline-size:100%;block-size:100%;margin:0;opacity:0;cursor:pointer}
  .mode-option span{display:flex;align-items:center;justify-content:center;gap:7px;min-block-size:46px;border:1px solid var(--border);border-radius:13px;background:var(--bg);font-size:.75rem;font-weight:700;transition:background .2s,border-color .2s}
  .mode-option input:checked+span{background:var(--soft);border-color:var(--green);color:var(--green)}
  body.dark .mode-option input:checked+span{color:#d7eddd}
  .mode-option:has(input:focus-visible) span{outline:2px solid var(--gold);outline-offset:2px}
  .group-field{margin-block-end:6px}

  .counter-area{text-align:center;padding-block:8px 4px}
  .target-badge{display:inline-flex;align-items:center;max-inline-size:100%;padding:5px 14px;border-radius:999px;background:var(--soft);color:var(--green);border:1px solid var(--border);font-size:.625rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  body.dark .target-badge{color:#d7eddd}
  body[data-mode=group] .target-badge{background:#f8f0df;color:#765a28;border-color:#ead8ad}
  body.dark[data-mode=group] .target-badge{background:#3a3220;color:#f0dfb7;border-color:#5a4a28}
  .counter-label{font-size:.6875rem;color:var(--muted);margin-block-start:10px}
  .counter-number{font-size:clamp(3rem,2.4rem + 3vw,4rem);font-weight:800;direction:ltr;color:var(--green);line-height:1.3;font-variant-numeric:tabular-nums}
  body.dark .counter-number{color:#e5c985}
  .count-sub{min-block-size:1.6em;max-inline-size:40ch;margin-inline:auto}
  .goal-line{display:flex;justify-content:space-between;align-items:center;gap:8px;max-inline-size:340px;margin:8px auto 0;font-size:.6875rem;color:var(--muted)}
  .goal-line strong{color:var(--green);font-size:.75rem}
  body.dark .goal-line strong{color:#e5c985}
  .progress{block-size:8px;background:var(--border);border-radius:20px;overflow:hidden;max-inline-size:340px;margin:8px auto 13px}
  .progress.thin{block-size:6px;max-inline-size:none;margin:9px 0 0}
  .progress>div{block-size:100%;inline-size:0;background:linear-gradient(90deg,var(--green2),var(--gold));transition:inline-size .2s}
  .count-btn{
    --d:clamp(150px,46vw,190px);
    inline-size:var(--d);block-size:var(--d);min-block-size:0;padding:0;border-radius:50%;
    border:9px solid #c5a26735;background:linear-gradient(145deg,#218052,#0c4229);color:#fff;
    font-size:1.3rem;font-weight:800;box-shadow:0 12px 30px #104d3240,inset 0 0 0 2px #ffffff20;
    flex-direction:column;gap:0;margin:12px auto 16px;user-select:none;-webkit-user-select:none;
  }
  .count-btn:active{transform:scale(.95)}
  .count-btn small{font-size:.625rem;opacity:.8;margin-block-start:5px;font-weight:500}

  /* --- آمار و فهرست --- */
  .grid-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .stat{padding:13px;background:var(--bg);border:1px solid var(--border);border-radius:15px}
  .stat small{display:block;color:var(--muted);font-size:.625rem}
  .stat strong{display:block;font-size:1.4rem;color:var(--green);margin-block-start:4px;font-variant-numeric:tabular-nums}
  body.dark .stat strong{color:#e3c785}
  .list{display:grid;gap:9px}
  .item{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px}
  .list>.item,.card>.item,#khatmList>.item,#groupList>.item{margin-block-end:9px}
  .item strong{font-size:.75rem}
  .item p.small{margin-block-start:4px;line-height:1.9}
  .item button{margin-block-start:8px;margin-inline-end:6px}
  .list-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .empty{text-align:center;color:var(--muted);font-size:.75rem;padding:18px 5px}

  /* --- تنظیمات --- */
  .setting{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-block-end:1px solid var(--border)}
  .setting:last-child{border:0}
  .setting strong{font-size:.75rem}
  .setting small{display:block;color:var(--muted);font-size:.625rem}
  .toggle{position:relative;flex:none;inline-size:43px;block-size:24px}
  .toggle input{position:absolute;inset:0;margin:0;opacity:0;cursor:pointer;z-index:1}
  .toggle span{position:absolute;inset:0;border-radius:30px;background:#b6c1ba;transition:.2s}
  .toggle span::before{content:"";position:absolute;inline-size:18px;block-size:18px;inset-inline-start:3px;inset-block-start:3px;background:#fff;border-radius:50%;transition:transform .2s}
  .toggle input:checked+span{background:var(--green)}
  .toggle input:checked+span::before{transform:translateX(-19px)}
  .toggle input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}

  /* --- نوار ورود و کارت‌های کوچک --- */
  .login-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-block-end:14px;padding:12px 14px;background:var(--soft);border:1px solid var(--border);border-radius:16px;font-size:.6875rem;color:var(--green)}
  body.dark .login-banner{color:#d6ebdc}
  .login-banner span{flex:1;min-inline-size:200px}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-block-end:14px}
  .duo>.card{margin:0;display:flex;flex-direction:column;justify-content:center;gap:2px;min-block-size:96px;text-align:center}
  .mini-cap{font-size:.625rem;color:var(--muted)}
  .mini-ar{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:1.5rem;line-height:1.6;color:var(--green)}
  body.dark .mini-ar{color:#e8cf96}
  .mini-ar.sm{font-size:1rem;line-height:1.9}
  .mini-title{font-size:.8125rem;color:var(--green)}
  body.dark .mini-title{color:#e5c985}
  .mini-sub{font-size:.6875rem;color:var(--muted)}
  #asmaName{animation:fade .6s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  footer{text-align:center;color:var(--muted);font-size:.625rem;padding:12px 15px 20px}
  footer strong{color:var(--green)}
  body.dark footer strong{color:#e5c985}

  /* --- ناوبری پایین --- */
  .nav{position:fixed;z-index:20;inset-inline:0;inset-block-end:0;background:var(--card);border-block-start:1px solid var(--border);display:flex;justify-content:center;padding:7px 3px calc(7px + env(safe-area-inset-bottom,0px))}
  .nav-inner{inline-size:100%;max-inline-size:900px;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
  .nav button{min-block-size:0;background:none;border:0;border-radius:12px;color:var(--muted);font-size:.5625rem;flex-direction:column;gap:4px;padding:5px 1px}
  .nav button .ico{font-size:1.2rem;line-height:1}
  .nav button.active{color:var(--green);font-weight:800}
  body.dark .nav button.active{color:#e5c985}

  /* --- نصب و پنجره‌ها --- */
  .install-banner{position:fixed;z-index:30;inset-inline:12px;inset-block-end:calc(86px + env(safe-area-inset-bottom,0px));max-inline-size:520px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--gold);border-radius:16px;box-shadow:var(--shadow)}
  .install-text{flex:1;font-size:.6875rem;line-height:1.8}
  .install-actions{display:flex;gap:7px;align-items:center}

  dialog{padding:0;border:0;background:transparent;color:inherit;margin:auto;max-inline-size:100vi;max-block-size:100dvh;overflow:visible}
  dialog::backdrop{background:rgb(0 0 0/.55);backdrop-filter:blur(4px)}
  dialog[open]{animation:dlg .25s ease}
  @keyframes dlg{from{opacity:0;transform:translateY(10px) scale(.98)}}
  .modal-panel{position:relative;inline-size:min(92vw,440px);max-block-size:88dvh;overflow:auto;padding:22px 20px 20px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:22px;box-shadow:0 24px 70px rgb(0 0 0/.35);text-align:center}
  .modal-panel h2{font-size:1rem;margin-block:6px 14px}
  .modal-panel h3{font-size:.875rem;color:var(--green)}
  body.dark .modal-panel h3{color:#e5c985}
  .modal-panel p{font-size:.75rem;line-height:2}
  .modal-close{position:absolute;inset-inline-start:12px;inset-block-start:10px;inline-size:36px;block-size:36px;min-block-size:0;padding:0;border-radius:50%;font-size:1.25rem}
  .help-step-count{font-size:.625rem;color:var(--muted)}
  .help-progress{block-size:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-block:16px}
  .help-progress span{display:block;block-size:100%;inline-size:0;background:linear-gradient(90deg,var(--green2),var(--gold));transition:inline-size .25s}
  .modal-actions{display:flex;gap:9px}
  .modal-actions button{flex:1}
  .about-symbol{font-size:2rem;color:var(--gold)}
  .memorial-card{margin-block:12px;text-align:center;box-shadow:none;background:var(--soft)}
  .memorial-card h3{margin-block-end:8px}
  .about-contact{margin-block-start:14px;padding-block-start:12px;border-block-start:1px solid var(--border)}
  .about-contact a{direction:ltr;unicode-bidi:embed;text-decoration:none}
  .about-contact p{overflow-wrap:anywhere}
}

/* =============== RESPONSIVE =============== */
@layer responsive{
  @media (max-width:419px){.duo{grid-template-columns:1fr}}
  @media (max-width:360px){
    .prayer-item b{font-size:.625rem}
    .clock{font-size:1.5rem}
  }
  @media (min-width:650px){
    main{padding:22px}
    .grid-stats{grid-template-columns:repeat(3,1fr)}
    .card{padding:20px}
    .prayer-item b{font-size:.8125rem}
  }
  /* دسکتاپ: صفحهٔ اول دو ستونه (شمارنده | اوقات و کارت‌ها) */
  @media (min-width:900px){
    html{font-size:112.5%}
    .app{max-inline-size:1080px}
    .nav-inner{max-inline-size:1080px}
    .home-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);grid-template-rows:repeat(5,auto) 1fr;column-gap:18px;align-items:start}
    .home-grid>*{grid-column:2}
    .home-grid>.counter-card{grid-column:1;grid-row:1/-1;position:sticky;inset-block-start:16px}
  }
  @media (max-height:520px) and (orientation:landscape){
    .count-btn{--d:130px}
  }
  @media (hover:none){button:hover{filter:none}}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{transition:none!important;animation:none!important}
  }
}
</style>

<meta name="application-name" content="صلوات شمار">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
</head>

<body data-mode="personal">
<script>try{if(localStorage.getItem('salavat_theme')==='dark')document.body.classList.add('dark')}catch(e){}</script>

<div id="installBanner" class="install-banner hidden" role="dialog" aria-label="نصب برنامه">
  <div class="install-text"><strong>صلوات شمار را نصب کنید</strong><br><span>برای دسترسی سریع‌تر، برنامه را روی دستگاه نصب کنید.</span></div>
  <div class="install-actions">
    <button type="button" class="green" id="installAppBtn">نصب</button>
    <button type="button" id="closeInstallBtn" aria-label="بستن">×</button>
  </div>
</div>

<div class="app">

<header>
  <div class="head">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">۞</div>
      <div>
        <h1>صلوات شمار</h1>
        <p>رفیق آرام لحظه‌های معنوی تو</p>
      </div>
    </div>
    <div class="head-actions">
      <button type="button" class="head-btn" data-action="toggleDark" title="حالت شب" aria-label="حالت شب">☾</button>
      <button type="button" class="head-btn" id="accountBtn" data-action="openAccount" title="ورود / ثبت‌نام" aria-label="ورود / ثبت‌نام">👤</button>
      <button type="button" class="head-btn" data-action="showTab" data-arg="settingsTab" title="تنظیمات" aria-labe
